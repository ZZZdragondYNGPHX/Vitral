[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
timeout = 30
timeout_method = thread
markers =
    tier1: Tier 1 isolated minimal requirement tests (F01-F20)
    tier2: Tier 2 boundary, edge-case, and negative tests (F01-F20)
    tier3: Tier 3 pairwise cross-feature integration tests
    tier4: Tier 4 real-world multi-step workflow scenarios
    harness: Local mock harness and test-runner smoke tests
    fixtures: Deterministic test fixture integrity checks
    tokens: Design tokens v1.1 conformance assertions
    requires_core: Requires built vitral-core / vitral-cli / libvitral_ffi.so
    requires_linux: Requires built Linux Fcitx5 addon and Linux Tauri v2 binary
    requires_android: Requires built Android APK and/or JNI libraries
    requires_windows: Requires cross-compiled Windows TSF DLL and Windows Tauri exe
