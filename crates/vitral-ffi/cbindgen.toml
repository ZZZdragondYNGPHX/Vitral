language = "C"
cpp_compat = true
include_guard = "VITRAL_CORE_H"
pragma_once = true
no_includes = false
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
header = "/* Auto-generated by cbindgen from vitral-ffi. C ABI v1. */"
style = "both"

[export]
exclude = ["vitral_fcitx_command"]
prefix = ""
include = [
  "VitralStatus",
  "VitralSchema",
  "VitralOpenCcMode",
  "VitralSwipeDir",
  "VitralHwMode",
  "VitralAiMode",
  "VitralLexiconFormat",
  "VitralStrokePoint",
  "VitralStringResult",
  "VitralEngine",
]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false
