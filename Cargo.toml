[workspace]
resolver = "2"
members = [
    "crates/vitral-tokens",
    "crates/vitral-core",
    "crates/vitral-ffi",
    "crates/vitral-jni",
    "crates/vitral-tsf",
    "crates/vitral-cli",
]
exclude = [
    "apps/desktop-tauri/src-tauri",
]

[workspace.package]
version = "0.4.3"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
jni = "0.21"
windows = "0.58"
pinyin = "0.11"
sha2 = "0.10"
ciborium = "0.2"
memmap2 = "0.9"
ort = { version = "2.0.0-rc.15", default-features = false }
opendal = { version = "0.59.5", default-features = false }
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false }
reqwest = { version = "0.13", default-features = false }
rustls = { version = "0.23", default-features = false }
webpki-roots = "1.0"
tokio = { version = "1", default-features = false }
chacha20poly1305 = "0.11"
getrandom = "0.2"
zstd = "0.14"
tiny_http = "0.12"
ureq = "3.5"
socket2 = "0.6"
mdns-sd = { version = "0.22", default-features = false }
chrono = { version = "0.4", default-features = false }

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false
