<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitral</title><link rel="stylesheet" href="generated/tokens.css"><link rel="stylesheet" href="style.css"></head>
<body><a class="skip" href="#main">跳至设置</a><aside><div class="brand"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m9 9 15 30L39 9l-15 11z"/></svg>Vitral</div><nav aria-label="管理中心"><button data-tab="input" aria-current="page">输入与外观</button><button data-tab="library">词库与剪贴板</button><button data-tab="cloud">同步与换机</button><button data-tab="tools">语音与 AI</button></nav></aside>
<main id="main" tabindex="-1"><header><span>管理中心</span><h1>输入与外观</h1></header>
<section id="input">
<article class="preview"><div class="capsule" aria-label="候选字号预览"><span><small>1</small> 今日</span><span><small>2</small> 近日</span><span><small>3</small> 尽日</span><span><small>4</small> 金日</span><span><small>5</small> 紧日</span></div><p>候选字号预览</p></article>
<article><h2>键盘</h2><label>输入方案<select name="schema"><option value="double_pinyin_flypy">小鹤双拼</option><option value="rime_ice">雾凇全拼</option></select></label><label>常用词权重减半周期<select name="frecency_half_life_sec"><option value="86400">1 天</option><option selected value="604800">7 天</option><option value="2592000">30 天</option></select></label><label>字形<select name="opencc_mode"><option value="simplified">简体</option><option value="traditional">繁體</option><option value="taiwan_standard">臺灣正體</option><option value="hong_kong">香港繁體</option></select></label><label>候选字号<span><input type="range" min="13" max="22" value="16" name="candidate_font_px"><output>16 px</output></span></label><label>主题<select name="theme"><option value="system">跟随系统</option><option value="dark">深色</option><option value="light">浅色</option></select></label><p>保存后，字号和主题会应用到 Fcitx5 经典候选面板。候选显示时，Ctrl + 1–5 置顶对应词，Alt + 1–5 移除。</p></article></section>
<section id="library" hidden><article><h2>导入词库</h2><button id="import" class="drop">选择或拖入词库文件<small>.scel · .dict.yaml · TSV · TXT</small></button></article>
<article><h2>剪贴板历史</h2><label>保留条数<span><input name="clipboard_ring_capacity" type="range" min="20" max="200" value="50"><output>50 条</output></span></label><div class="actions"><button data-action="clipboard-state">读取历史</button><button data-action="clipboard-clear-unpinned">清空未置顶</button></div><ul id="entries"></ul></article></section>
<section id="cloud" hidden><article><label><strong>纯离线模式</strong><input name="pure_offline" type="checkbox"></label><p>开启后仍可使用拼音、手写和本机语音转写。</p></article><article><h2>Koofr WebDAV</h2><label>端点<input name="koofr_endpoint" type="url" placeholder="https://app.koofr.net/dav/Koofr"></label><label>账户<input name="koofr_username" autocomplete="username"></label><label>应用密码<input name="koofr_password" type="password" autocomplete="new-password" placeholder="输入新密码以替换"></label><label>同步密钥<input name="sync_key" type="password" autocomplete="off"></label><div class="actions"><button data-action="storage" class="online">查看云盘用量</button><button data-action="restore-from-koofr" class="online">从备份恢复</button></div><dl id="usage"></dl></article><article><h2>设备闪传</h2><button class="online" data-action="relay-discover">发现设备并开启接收</button><button data-action="relay-stop-discovery">关闭局域网接收</button><ul id="devices"></ul><button data-action="relay-poll-inbox" class="online">接收文件和文本</button><ul id="inbox"></ul></article></section>
<section id="tools" hidden><article><h2>AI 服务</h2><label>服务地址<input name="ai_endpoint" type="url" placeholder="http://localhost:11434"></label><label>模型<input name="ai_model" placeholder="qwen2.5:7b"></label><label>API 密钥<input name="ai_api_key" type="password" autocomplete="off"></label><label>允许 AI 在手写候选中消歧<input name="ai_tier3_enabled" type="checkbox"></label></article>
<article><h2>录音与文本</h2><textarea id="source" rows="4" aria-label="原文或转写" placeholder="输入原文，或录音后在此校对转写"></textarea><div class="actions"><button id="record">开始录音</button><select id="target-lang" aria-label="翻译目标语言"><option value="en">英语</option><option value="zh">中文</option><option value="ja">日语</option></select><button class="online" data-ai="translate">翻译</button><button class="online" data-ai="polish">润色</button><button class="online" data-ai="summary">摘要</button></div><p id="result"></p></article></section>
<footer><span id="notice" role="status" aria-live="polite"></span><button class="primary" id="save">保存设置</button></footer></main>
<script type="module" src="ui.js"></script></body></html>
